name: Offline harness tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline regression tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Verify generated checklist
        run: |
          python tools/engineering_harness.py catalog --output harness/CHECKLIST-RU.md
          git diff --exit-code -- harness/CHECKLIST-RU.md
